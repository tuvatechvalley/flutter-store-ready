name: Flutter production gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Format · Analyze · Tests · Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Gates + production readiness report
        run: dart run tool/flutter_production/verify.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-readiness-report
          path: build/reports/flutter-production/

  security:
    name: Secrets & vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a deleted secret is still in history
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Known vulnerabilities (OSV)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest \
            scan source --lockfile=/src/pubspec.lock

  android:
    name: Android release build
    runs-on: ubuntu-latest
    needs: gates
    if: hashFiles('android/app/build.gradle.kts', 'android/app/build.gradle') != ''
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release app bundle (obfuscated, CI-signed)
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            $( [ -f config/dev.json ] && echo --dart-define-from-file=config/dev.json )
