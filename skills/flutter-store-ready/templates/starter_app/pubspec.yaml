name: starter_app
description: >-
  Production-ready, security-hardened Flutter starter: global error handling,
  typed failures, SPKI certificate pinning, secure storage, responsive
  layouts and automated quality gates.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Material is a standalone package since Flutter 3.47.
  material_ui: ^1.10.0
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.0
  connectivity_plus: ^7.1.0
  sentry_flutter: ^10.0.0
  crypto: ^3.0.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
